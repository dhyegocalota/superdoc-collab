name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:hooks

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: libs, filter: ./libs/* }
          - { name: web, filter: "@superdoc-collab/web" }
          - { name: server, filter: "@superdoc-collab/server" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install
      - run: pnpm --filter "${{ matrix.filter }}" test:unit
        env:
          REQUIRE_DOCKER_COMPOSE: ${{ matrix.name == 'server' }}

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: superdoc-collab:ci
      SMOKE_ORIGIN: http://127.0.0.1:3000
      SMOKE_AUTH_SECRET: ci-smoke-auth-secret-with-at-least-32-characters
      SMOKE_DEMO_PASSWORD: ci-smoke-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Refuse to seed without a demo password
        run: |
          set -euo pipefail
          status=0
          docker run --rm -e SEED_DEMO_USERS=true "$IMAGE" > refusal.log 2>&1 || status=$?
          cat refusal.log
          test "$status" -eq 1
          grep -q 'Missing environment variable: DEMO_PASSWORD' refusal.log
      - name: Start the image on a named volume
        run: >-
          docker run -d --name app -p 3000:3000 -v superdoc-ci-data:/data
          -e APP_ORIGIN="$SMOKE_ORIGIN" -e AUTH_SECRET="$SMOKE_AUTH_SECRET" -e TRUST_PROXY=true
          -e SEED_DEMO_USERS=true -e DEMO_PASSWORD="$SMOKE_DEMO_PASSWORD" "$IMAGE"
      - name: Health answers 200
        run: curl --fail --silent --show-error --max-time 5 --retry 30 --retry-delay 2 --retry-max-time 120 --retry-all-errors "$SMOKE_ORIGIN/api/health"
      - name: The web app is served
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --output index.html "$SMOKE_ORIGIN/"
          grep -q '<title>SuperDoc Collab</title>' index.html
      - name: The data volume belongs to the node user
        run: test "$(docker exec app stat -c %u /data)" = "1000"
      - name: A seeded demo user signs in
        run: |
          set -euo pipefail
          status=$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' -H 'content-type: application/json' -H "origin: $SMOKE_ORIGIN" -d "{\"email\":\"ana@example.com\",\"password\":\"$SMOKE_DEMO_PASSWORD\"}" "$SMOKE_ORIGIN/api/auth/sign-in/email")
          echo "sign-in status: $status"
          test "$status" = "200"
      - name: Restart keeps the data and the accounts
        run: |
          set -euo pipefail
          docker rm -f app
          docker run -d --name app -p 3000:3000 -v superdoc-ci-data:/data -e APP_ORIGIN="$SMOKE_ORIGIN" -e AUTH_SECRET="$SMOKE_AUTH_SECRET" -e TRUST_PROXY=true -e SEED_DEMO_USERS=true -e DEMO_PASSWORD="$SMOKE_DEMO_PASSWORD" "$IMAGE"
          curl --fail --silent --show-error --max-time 5 --retry 30 --retry-delay 2 --retry-max-time 120 --retry-all-errors "$SMOKE_ORIGIN/api/health"
          docker logs app > app.log 2>&1
          grep -q 'existing: ana@example.com' app.log
          status=$(curl --silent --max-time 10 --output /dev/null --write-out '%{http_code}' -H 'content-type: application/json' -H "origin: $SMOKE_ORIGIN" -d "{\"email\":\"ana@example.com\",\"password\":\"$SMOKE_DEMO_PASSWORD\"}" "$SMOKE_ORIGIN/api/auth/sign-in/email")
          echo "sign-in after restart status: $status"
          test "$status" = "200"
      - if: failure()
        run: docker logs app

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - run: pnpm security:audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
