name: superdoc-collab
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "3000"
    environment:
      PORT: "3000"
      DATABASE_DIR: /data
      WEB_DIST_DIR: /app/web
      TRUST_PROXY: "true"
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to https://<your domain> in the Dokploy environment}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the Dokploy environment}
      SEED_DEMO_USERS: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY-}
      LLM_MODEL: ${LLM_MODEL-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL-}
      LLM_MAX_CONCURRENT_JOBS: ${LLM_MAX_CONCURRENT_JOBS-}
      LLM_MAX_CALLS_PER_HOUR: ${LLM_MAX_CALLS_PER_HOUR-}
      OPEN_UNCOMMITTED_PER_MINUTE: ${OPEN_UNCOMMITTED_PER_MINUTE-}
      UPLOADS_PER_MINUTE: ${UPLOADS_PER_MINUTE-}
      MAX_BOOTSTRAP_WAIT_MS: ${MAX_BOOTSTRAP_WAIT_MS-}
      AGENT_PRESENCE_LINGER_MS: ${AGENT_PRESENCE_LINGER_MS-}
      ROOM_HEAP_BUDGET_MEGABYTES: ${ROOM_HEAP_BUDGET_MEGABYTES-}
      MAX_HEAVY_CONVERSIONS_PER_HOUR: ${MAX_HEAVY_CONVERSIONS_PER_HOUR-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS-}
    volumes:
      - superdoc-data:/data
    restart: unless-stopped

volumes:
  superdoc-data:
