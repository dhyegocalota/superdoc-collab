<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperDoc Collab</title>
    <meta name="description" content="Edit a DOCX together in real time and see how it evolves over time and across contributors." />
    <meta name="application-name" content="SuperDoc Collab" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SuperDoc Collab" />
    <meta property="og:title" content="SuperDoc Collab" />
    <meta property="og:description" content="Edit a DOCX together in real time and see how it evolves over time and across contributors." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SuperDoc Collab" />
    <meta
      name="twitter:description"
      content="Edit a DOCX together in real time and see how it evolves over time and across contributors."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SuperDoc Collab",
        "description": "Edit a DOCX together in real time and see how it evolves over time and across contributors.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "author": {
          "@type": "Person",
          "name": "Dhyego Calota",
          "url": "https://github.com/dhyegocalota"
        },
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "codeRepository": "https://github.com/dhyegocalota/superdoc-collab",
        "isBasedOn": {
          "@type": "SoftwareApplication",
          "name": "SuperDoc",
          "url": "https://www.superdoc.dev"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('superdoc-collab.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (error) {
          return;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
